name: Feature request
description: Suggest a new provider, capability, or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the feature and the problem it solves for you.
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Related provider (if any)
      options:
        - Not provider-specific
        - OpenAI (ChatGPT / Codex)
        - Claude (Anthropic)
        - SuperGrok / xAI
        - GitHub Copilot
        - Cursor
        - OpenCode (Go / Zen)
        - Ollama Cloud
        - Z.ai
        - MiniMax
        - Mistral
        - Kimi
        - A new provider (name it above)
    validations:
      required: false
  - type: textarea
    id: raw-response
    attributes:
      label: Last quota response (JSON)
      description: >
        If your request concerns data a provider already returns (for example a usage window the
        plugin does not show yet), please paste the provider's raw response: open
        `Settings > Tools > LLM Subscription Usage`, select the provider tab, and copy the
        `Last quota response` shown there. Feel free to anonymize/redact fields you consider
        sensitive (emails, account IDs, tokens) — but please keep the overall structure and
        field names intact.
      render: json
    validations:
      required: false
